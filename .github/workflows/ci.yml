name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # Control-plane self-test: gate scripts are tested unconditionally — no
  # skeleton guard, because these need no project src/ or requirements. The
  # selftest_ (not test_) filename keeps it out of the frozen suite's bare
  # `pytest` collection in orchestrate.sh/refreeze.sh.
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest reporting + ruff
        # ruff: the refreeze fixture selftests run the real apply path,
        # whose D-67 staged-test lint gate fails closed without it.
        run: pip install pytest pytest-json-report ruff
      - name: Lint control-plane Python
        run: ruff check --isolated --select E4,E7,E9,F scripts/
      - name: Gate-script self-tests
        run: pytest scripts/selftest/selftest_gates.py scripts/selftest/selftest_b4a.py -q

  test:
    runs-on: ubuntu-latest
    # NOTE: the skeleton guard is a STEP, not a job-level `if` — hashFiles()
    # is not available in job-level expressions (no workspace exists yet);
    # using it there makes the whole workflow file invalid (0s failure).
    # --- Postgres for projects that need it (uncomment both blocks below) ---
    # services:
    #   postgres:
    #     image: postgres:15
    #     env:
    #       POSTGRES_USER: testuser
    #       POSTGRES_PASSWORD: testpass
    #       POSTGRES_DB: testdb
    #     options: >-
    #       --health-cmd pg_isready
    #       --health-interval 10s
    #       --health-timeout 5s
    #       --health-retries 5
    #     ports:
    #       - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Guard — skip bare template skeletons
        id: guard
        run: |
          if [ -f requirements.txt ] && [ -d src ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
            echo "::notice::skeleton repo (no requirements.txt + src/ yet) — CI steps skipped"
          fi
      - name: Set up Python
        if: steps.guard.outputs.run == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        if: steps.guard.outputs.run == 'yes'
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov pytest-json-report pytest-xdist ruff mypy respx
      - name: Lint
        if: steps.guard.outputs.run == 'yes'
        run: ruff check src/
      - name: Type check
        if: steps.guard.outputs.run == 'yes'
        # --explicit-package-bases: src/ layouts without __init__.py files make
        # bare `mypy src/` exit 2 on "Duplicate module named" (api/models.py vs
        # services/models.py) BEFORE type-checking a single line.
        run: mypy --explicit-package-bases src/
      # If using Postgres, uncomment DATABASE_URL and the services block above:
      # - name: Run tests
      #   env:
      #     DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
      #   run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80
      # Browser oracle (D-58): the frozen suite includes Playwright UI tests,
      # which need the browser binary installed on the runner.
      - name: Install Playwright browser
        if: steps.guard.outputs.run == 'yes'
        run: |
          if pip show playwright >/dev/null 2>&1; then
            playwright install --with-deps chromium
          fi
      - name: Run tests
        if: steps.guard.outputs.run == 'yes'
        # PYTHONPATH: tests import `src.*` from the repo root (the sandbox sets
        # /work; CLAUDE.md documents `PYTHONPATH=. pytest`; CI must match).
        # mkdir: pytest-json-report does not create the report's parent dir.
        env:
          PYTHONPATH: .
        # fail-under=79 (ratcheted 2026-07-22, CEO-approved; was 75 from
        # 2026-07-14). The 75 floor was set when the Linux runner measured 78
        # vs 83 on macOS — status.py's RAM-counter paths are mac-specific and
        # unreachable here, and that platform delta still holds. The suite has
        # since grown 110 -> 151 frozen tests.
        # MEASURE BEFORE RATCHETING, and read the unrounded number: the term
        # report prints "80%" but the real figure at spec v57 is 79.82%
        # (649 stmts, 131 missed), so fail-under=80 FAILS on a fully green
        # 151/151 suite. Verified by running this exact command in the Linux
        # sandbox container before committing.
        # Clearing 80 is not a CI-config change — it needs real coverage, and
        # under INV-1 no agent may author tests: it takes a TPM spec + refreeze.
        # Standing gap for that milestone: status.py at 38% (61 of 99 stmts).
        #
        # -n auto --dist=loadfile: pytest-xdist parallelizes across the runner's
        # cores. loadfile keeps every test in one file on a single worker, so
        # module-scoped conftest fixtures (server-per-file, session temp data)
        # are not rebuilt across workers and file-local test ordering holds. The
        # conftest port allocator is per-process, so each worker self-allocates
        # loopback ports with no cross-worker collision. pytest-json-report and
        # pytest-cov are both xdist-aware: workers stream results to the
        # coordinator, which writes the single merged report + combined coverage
        # (--cov-fail-under stays 79, unchanged — parallelism must not weaken it).
        run: |
          mkdir -p .cache
          pytest -n auto --dist=loadfile --cov=src --cov-report=term-missing --cov-fail-under=79 --json-report --json-report-file=.cache/test-report.json
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always() && steps.guard.outputs.run == 'yes'
