[pytest]
# Scope collection to the frozen suite. The pipeline already invokes
# `pytest tests/` explicitly (scripts/orchestrate.sh), so this only fixes the
# bare host invocation: without it, pytest walks the repo root and collides on
# duplicate test basenames parked under project-trail/*-staging/tests/
# ("import file mismatch"). No effect on the sandbox oracle.
testpaths = tests
