<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <button type="button" class="new-thread-btn" id="new-thread-btn" data-testid="new-thread-btn">+ New Chat</button>
      <input type="text" id="thread-search" class="thread-search" data-testid="thread-search-input" placeholder="Search threads...">
      <div class="search-hit-nav" hidden>
        <button type="button" class="hit-nav-btn" data-testid="search-prev-btn">▲</button>
        <span data-testid="search-hit-count"></span>
        <button type="button" class="hit-nav-btn" data-testid="search-next-btn">▼</button>
      </div>
      <div class="thread-list" id="thread-list"></div>
    </aside>
    <main class="chat-panel">
      <div class="terminal-titlebar" data-testid="terminal-titlebar">
        <span class="tl-dot"></span>
        <span class="tl-dot"></span>
        <span class="tl-dot"></span>
        <span class="tl-title">testchat — local session</span>
      </div>
      <div class="top-bar">
        <div class="model-field">
          <select id="model-select" data-testid="model-select"><option value="">Loading models...</option></select>
          <button type="button" class="theme-toggle no-auto-margin" id="eject-model-btn" data-testid="eject-model-btn" title="Unload the active model" hidden>⏏</button>
        </div>
        <button type="button" class="theme-toggle" id="settings-toggle" data-testid="settings-toggle" title="System prompt">⚙</button>
        <button type="button" class="theme-toggle no-auto-margin" id="theme-toggle" data-testid="theme-toggle" title="Switch theme">☀️</button>
        <button type="button" class="theme-toggle no-auto-margin" id="fullscreen-toggle" data-testid="fullscreen-toggle" title="Focus mode (Esc to exit)">⛶</button>
      </div>
      <div class="chat-container" id="chat-container"></div>
      <form class="input-area" id="chat-form">
        <textarea id="message-input" data-testid="message-input" placeholder="Type a message... (Enter to send, Shift+Enter for newline)" autocomplete="off" rows="1" required></textarea>
        <button type="button" class="think-toggle" id="think-toggle" data-testid="think-toggle" title="Toggle thinking display">💭</button>
        <button type="button" class="think-toggle" id="web-toggle" data-testid="web-toggle" title="Search the web for this message">🌐</button>
        <button type="submit" id="send-btn" data-testid="send-btn">Send</button>
      </form>
      <div class="status-strip" id="status-strip" data-testid="status-strip">
        <span id="status-model">no model</span>
        <span id="status-ram"></span>
        <span id="status-save" data-testid="save-status"></span>
        <span id="status-history" data-testid="history-status"></span>
        <span class="status-spacer"></span>
        <span id="status-tps"></span>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="settings-modal" hidden>
    <div class="modal">
      <div class="modal-title">System prompt</div>
      <p class="modal-hint">Sent as the system message at the start of every request — all threads, all models. Leave empty for none.</p>
      <textarea id="system-prompt-input" data-testid="system-prompt-input" rows="7" placeholder="e.g. You are a concise assistant. Prefer plain language and short answers."></textarea>
      <div class="modal-actions">
        <button type="button" id="settings-cancel" data-testid="settings-cancel">Cancel</button>
        <button type="button" id="settings-save" data-testid="settings-save" class="primary">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="load-confirm-modal" data-testid="load-confirm-modal" hidden>
    <div class="modal">
      <div class="modal-title">Load model?</div>
      <p id="load-confirm-text" class="modal-hint"></p>
      <div class="modal-actions">
        <button type="button" id="load-cancel" data-testid="load-cancel">Cancel</button>
        <button type="button" id="load-confirm" data-testid="load-confirm" class="primary">Load model</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="delete-confirm-modal" data-testid="delete-confirm-modal" hidden>
    <div class="modal">
      <div class="modal-title">Delete?</div>
      <p id="delete-confirm-text" class="modal-hint"></p>
      <div class="modal-actions">
        <button type="button" id="delete-cancel" data-testid="delete-cancel">Cancel</button>
        <button type="button" id="delete-confirm" data-testid="delete-confirm" class="danger">Delete</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="unload-confirm-modal" data-testid="unload-confirm-modal" hidden>
    <div class="modal">
      <div class="modal-title">Unload model?</div>
      <p id="unload-confirm-text" class="modal-hint"></p>
      <div class="modal-actions">
        <button type="button" id="unload-cancel" data-testid="unload-cancel">Cancel</button>
        <button type="button" id="unload-confirm" data-testid="unload-confirm" class="primary">Unload</button>
      </div>
    </div>
  </div>

  <script src="/static/rain.js"></script>
  <script src="/static/markdown.js"></script>
  <script src="/static/threads.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
