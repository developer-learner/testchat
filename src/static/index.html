<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: #0084ff;
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    .bubble.reply {
      align-self: flex-start;
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 0.25rem;
    }

    .input-area {
      display: flex;
      padding: 1rem;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      gap: 0.5rem;
    }

    .input-area input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 2rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #0084ff;
    }

    .input-area button {
      padding: 0.75rem 1.5rem;
      background: #0084ff;
      color: #fff;
      border: none;
      border-radius: 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover {
      background: #0073e6;
    }

    .input-area button:disabled {
      background: #99c8ff;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-container" id="chat-container"></div>
  <form class="input-area" id="chat-form">
    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required />
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    (function () {
      var form = document.getElementById('chat-form');
      var input = document.getElementById('message-input');
      var container = document.getElementById('chat-container');
      var sendBtn = document.getElementById('send-btn');

      function appendBubble(text, className) {
        var bubble = document.createElement('div');
        bubble.className = 'bubble ' + className;
        bubble.textContent = text;
        container.appendChild(bubble);
        container.scrollTop = container.scrollHeight;
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var message = input.value.trim();
        if (!message) return;

        appendBubble(message, 'user');
        input.value = '';
        sendBtn.disabled = true;

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/v1/chat', true);
        xhr.setRequestHeader('Content-Type', 'application/json');

        xhr.onload = function () {
          sendBtn.disabled = false;
          input.focus();
          if (xhr.status >= 200 && xhr.status < 300) {
            var data = JSON.parse(xhr.responseText);
            appendBubble(data.reply, 'reply');
          } else {
            appendBubble('Error: request failed with status ' + xhr.status, 'reply');
          }
        };

        xhr.onerror = function () {
          sendBtn.disabled = false;
          input.focus();
          appendBubble('Error: network request failed', 'reply');
        };

        xhr.send(JSON.stringify({ message: message }));
      });

      input.focus();
    })();
  </script>
</body>
</html>
