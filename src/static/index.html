<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      background: #f0f2f5;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .top-bar {
      display: flex;
      align-items: center;
      padding: 0.75rem 1rem;
      background: #fff;
      border-bottom: 1px solid #e0e0e0;
      gap: 0.75rem;
    }

    .top-bar label {
      font-size: 0.875rem;
      color: #333;
      font-weight: 600;
    }

    .top-bar select {
      padding: 0.5rem 2rem 0.5rem 0.75rem;
      border: 1px solid #ccc;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      outline: none;
      background: #fff;
      cursor: pointer;
    }

    .top-bar select:focus {
      border-color: #0084ff;
    }

    .top-bar select:disabled {
      background: #f0f0f0;
      cursor: not-allowed;
    }

    .nemotron-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 0.875rem;
      cursor: pointer;
      transition: background 0.2s, opacity 0.2s;
    }

    .nemotron-btn.load {
      background: #0084ff;
      color: #fff;
    }

    .nemotron-btn.load:hover {
      background: #0073e6;
    }

    .nemotron-btn.load:disabled {
      background: #99c8ff;
      cursor: not-allowed;
    }

    .nemotron-btn.unload {
      background: #ff4d4f;
      color: #fff;
    }

    .nemotron-btn.unload:hover {
      background: #e04345;
    }

    .nemotron-btn.unload:disabled {
      background: #ffa3a4;
      cursor: not-allowed;
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .chat-bubble {
      max-width: 70%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .chat-bubble.user {
      align-self: flex-end;
      background: #0084ff;
      color: #fff;
      border-bottom-right-radius: 0.25rem;
    }

    .chat-bubble.reply {
      align-self: flex-start;
      background: #fff;
      color: #1a1a1a;
      border: 1px solid #e0e0e0;
      border-bottom-left-radius: 0.25rem;
    }

    .chat-bubble.error {
      align-self: center;
      background: #ffe0e0;
      color: #cc0000;
      border: 1px solid #ffcccc;
    }

    .think-content {
      display: none;
      color: #888;
      font-style: italic;
    }

    .show-thinking .think-content {
      display: inline;
    }

    .input-area {
      display: flex;
      padding: 1rem;
      background: #fff;
      border-top: 1px solid #e0e0e0;
      gap: 0.5rem;
    }

    .input-area input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid #ccc;
      border-radius: 2rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus {
      border-color: #0084ff;
    }

    .input-area button {
      padding: 0.75rem 1.5rem;
      background: #0084ff;
      color: #fff;
      border: none;
      border-radius: 2rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    .input-area button:hover {
      background: #0073e6;
    }

    .input-area button:disabled {
      background: #99c8ff;
      cursor: not-allowed;
    }

    .think-toggle {
      background: #e8e8e8;
      color: #666;
      border: 1px solid #ccc;
      border-radius: 2rem;
      padding: 0.75rem 0.9rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s;
      min-width: 2.5rem;
    }

    .think-toggle.on {
      background: #e0f0ff;
      color: #0084ff;
      border-color: #0084ff;
    }

  </style>
</head>
<body>
  <div class="top-bar">
    <label for="model-select">Model:</label>
    <select id="model-select"><option value="">Loading models...</option></select>
    <button type="button" class="nemotron-btn load" id="load-nemotron">Load Nemotron</button>
    <button type="button" class="nemotron-btn unload" id="unload-nemotron">Unload Nemotron</button>
  </div>
  <div class="chat-container" id="chat-container"></div>
  <form class="input-area" id="chat-form">
    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required />
    <button type="button" class="think-toggle" id="think-toggle" title="Toggle thinking display">💭</button>
    <button type="submit" id="send-btn">Send</button>
  </form>

  <script>
    (function () {
      var FALLBACK_REPLY = 'Sorry, something went wrong. Please try again.';

      var form = document.getElementById('chat-form');
      var input = document.getElementById('message-input');
      var container = document.getElementById('chat-container');
      var sendBtn = document.getElementById('send-btn');
      var thinkToggle = document.getElementById('think-toggle');
      var modelSelect = document.getElementById('model-select');
      var loadNemotronBtn = document.getElementById('load-nemotron');
      var unloadNemotronBtn = document.getElementById('unload-nemotron');

      var showThinking = false;
      var replyText = '';
      var conversation = [];
      var messageSent = false;

      function appendBubble(text, type) {
        var bubble = document.createElement('div');
        bubble.className = 'chat-bubble ' + type;
        bubble.textContent = text;
        container.appendChild(bubble);
        scrollToBottom();
      }

      function scrollToBottom() {
        container.scrollTop = container.scrollHeight;
      }

      function renderThink(text) {
        var html = '';
        var parts = text.split(/(<think>|<\/think>)/);
        var inThink = false;
        for (var i = 0; i < parts.length; i++) {
          var part = parts[i];
          if (part === '<think>') { inThink = true; continue; }
          if (part === '</think>') { inThink = false; continue; }
          var escaped = part.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
          html += inThink ? '<span class="think-content">' + escaped + '</span>' : escaped;
        }
        return html;
      }

      function fetchModels() {
        fetch('/api/v1/models')
          .then(function (response) {
            if (!response.ok) throw new Error('Failed to fetch models');
            return response.json();
          })
          .then(function (data) {
            modelSelect.innerHTML = '';
            var models = data.models || [];
            if (models.length === 0) {
              var opt = document.createElement('option');
              opt.value = '';
              opt.textContent = 'No models available';
              modelSelect.appendChild(opt);
              return;
            }
            for (var i = 0; i < models.length; i++) {
              var opt = document.createElement('option');
              var id = models[i].id || '';
              opt.value = id;
              opt.textContent = id;
              modelSelect.appendChild(opt);
            }
          })
          .catch(function () {
            modelSelect.innerHTML = '<option value="">Failed to load models</option>';
          });
      }

      function lockSelector() {
        if (!messageSent) {
          messageSent = true;
          modelSelect.disabled = true;
        }
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        var message = input.value.trim();
        if (!message) return;

        appendBubble(message, 'user');
        input.value = '';
        sendBtn.disabled = true;

        var replyBubble = document.createElement('div');
        replyBubble.className = 'chat-bubble reply';
        container.appendChild(replyBubble);
        replyText = '';

        var bodyObj = { message: message, history: conversation };
        if (modelSelect.value) {
          bodyObj.model = modelSelect.value;
        }

        fetch('/api/v1/chat', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(bodyObj)
        })
        .then(function (response) {
          if (!response.ok) {
            throw new Error('Request failed with status ' + response.status);
          }

          var reader = response.body.getReader();
          var decoder = new TextDecoder('utf-8');
          var buffer = '';

          function processFrame(frame) {
            if (!frame || !frame.trim()) return;

            var eventType = '';
            var dataStr = '';

            frame.split('\n').forEach(function (line) {
              if (line.indexOf('event:') === 0) {
                eventType = line.substring(6).trim();
              } else if (line.indexOf('data:') === 0) {
                dataStr += line.substring(5).trim();
              }
            });

            if (!eventType) return;

            if (eventType === 'token') {
              try {
                var parsed = JSON.parse(dataStr);
                replyText += parsed.content;
              } catch (err) {
                replyText += dataStr;
              }
              replyBubble.innerHTML = renderThink(replyText);
              scrollToBottom();
            } else if (eventType === 'think') {
              try {
                var parsed = JSON.parse(dataStr);
                replyText += '<think>' + parsed.content + '</think>';
              } catch (err) {
                replyText += '<think>' + dataStr + '</think>';
              }
              replyBubble.innerHTML = renderThink(replyText);
              scrollToBottom();
            } else if (eventType === 'done') {
              conversation.push({ role: 'user', content: message });
              conversation.push({ role: 'assistant', content: replyText });
            } else if (eventType === 'error') {
              replyBubble.className = 'chat-bubble error';
              try {
                var errData = JSON.parse(dataStr);
                replyBubble.textContent = errData.message || FALLBACK_REPLY;
              } catch (err) {
                replyBubble.textContent = dataStr || FALLBACK_REPLY;
              }
            }
          }

          function read() {
            return reader.read().then(function (result) {
              if (result.done) {
                var remaining = buffer.trim();
                if (remaining) {
                  processFrame(remaining);
                }
                return;
              }

              buffer += decoder.decode(result.value, { stream: true });

              var parts = buffer.split('\n\n');
              for (var i = 0; i < parts.length - 1; i++) {
                processFrame(parts[i].trim());
              }
              buffer = parts[parts.length - 1];

              return read();
            });
          }

          lockSelector();
          return read();
        })
        .catch(function () {
          replyBubble.className = 'chat-bubble error';
          replyBubble.textContent = FALLBACK_REPLY;
        })
        .finally(function () {
          sendBtn.disabled = false;
          input.focus();
        });
      });

      thinkToggle.addEventListener('click', function () {
        showThinking = !showThinking;
        thinkToggle.classList.toggle('on');
        container.classList.toggle('show-thinking');
      });

      function refreshModels() {
        fetchModels();
      }

      loadNemotronBtn.addEventListener('click', function () {
        loadNemotronBtn.disabled = true;
        fetch('/api/v1/nemotron/load', { method: 'POST' })
          .then(function (response) {
            if (!response.ok) throw new Error('Failed to load Nemotron');
            refreshModels();
          })
          .catch(function () {
            appendBubble('Failed to load Nemotron', 'error');
          })
          .finally(function () {
            loadNemotronBtn.disabled = false;
          });
      });

      unloadNemotronBtn.addEventListener('click', function () {
        unloadNemotronBtn.disabled = true;
        fetch('/api/v1/nemotron/unload', { method: 'POST' })
          .then(function (response) {
            if (!response.ok) throw new Error('Failed to unload Nemotron');
            refreshModels();
          })
          .catch(function () {
            appendBubble('Failed to unload Nemotron', 'error');
          })
          .finally(function () {
            unloadNemotronBtn.disabled = false;
          });
      });

      fetchModels();
      input.focus();
    })();
  </script>
</body>
</html>
