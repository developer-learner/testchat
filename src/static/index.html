<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar">
      <button type="button" class="new-thread-btn" id="new-thread-btn">+ New Chat</button>
      <div class="thread-list" id="thread-list"></div>
    </aside>
    <main class="chat-panel">
      <div class="top-bar">
        <label for="model-select">Model:</label>
        <select id="model-select"><option value="">Loading models...</option></select>
        <button type="button" class="nemotron-btn load" id="load-nemotron">Load Nemotron</button>
        <button type="button" class="nemotron-btn unload" id="unload-nemotron">Unload Nemotron</button>
      </div>
      <div class="chat-container" id="chat-container"></div>
      <form class="input-area" id="chat-form">
        <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off" required />
        <button type="button" class="think-toggle" id="think-toggle" title="Toggle thinking display">💭</button>
        <button type="submit" id="send-btn">Send</button>
      </form>
    </main>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
